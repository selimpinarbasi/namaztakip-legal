<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feyz</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f9fafb; color: #111827; min-height: 100vh; display: flex; align-items: center; justify-content: center; transition: background 0.3s, color 0.3s; }
        body.dark { background: #111827; color: #f9fafb; }
        .controls { position: fixed; top: 1rem; right: 1rem; display: flex; gap: 0.5rem; }
        .ctrl-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.375rem 0.75rem; border: 1px solid #d1d5db; border-radius: 8px; background: none; font-size: 0.875rem; color: #4b5563; cursor: pointer; transition: all 0.3s; }
        .ctrl-btn:hover { background: #f3f4f6; }
        body.dark .ctrl-btn { border-color: #4b5563; color: #9ca3af; }
        body.dark .ctrl-btn:hover { background: #1f2937; }
        .container { text-align: center; padding: 2rem; }
        .logo { width: 80px; height: 80px; border-radius: 18px; margin-bottom: 1rem; }
        h1 { font-size: 1.5rem; margin-bottom: 2rem; }
        .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .links a { display: inline-block; padding: 0.75rem 1.5rem; background: #1e6b45; color: white; text-decoration: none; border-radius: 10px; font-weight: 500; transition: background 0.2s; }
        .links a:hover { background: #155a38; }
    </style>
</head>
<body>
    <div class="controls">
        <button class="ctrl-btn" onclick="toggleLang()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span id="langLabel">English</span>
        </button>
        <button class="ctrl-btn" onclick="toggleDark()">
            <svg id="darkIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
    </div>

    <div class="container">
        <img src="logo.png" alt="Feyz" class="logo">
        <h1>Feyz</h1>
        <div class="links">
            <a href="privacy.html" id="privacyLink">Gizlilik Politikasi</a>
            <a href="support.html" id="supportLink">Destek</a>
        </div>
    </div>

    <script>
        let lang = 'tr';
        let dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.body.classList.add('dark');

        function toggleLang() {
            lang = lang === 'tr' ? 'en' : 'tr';
            document.getElementById('langLabel').textContent = lang === 'tr' ? 'English' : 'Turkce';
            document.getElementById('privacyLink').textContent = lang === 'tr' ? 'Gizlilik Politikasi' : 'Privacy Policy';
            document.getElementById('supportLink').textContent = lang === 'tr' ? 'Destek' : 'Support';
            document.documentElement.lang = lang;
        }

        function toggleDark() {
            dark = !dark;
            document.body.classList.toggle('dark');
        }
    </script>
</body>
</html>
